<script>
const DATA = [{"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 1, "title": "Some Basic Concepts of Chemistry", "tags": "Board+CET+JEE", "file": "audio/C11-01-Some-Basic-Concepts.mp4", "formulas": "1 mole = 6.022×10²³ particles | molar mass = g/mol\nGas at STP: 1 mole = 22.4 L | n = m/M = V/22.4 = N/Nᴀ\nMolarity = n/V(L) | Molality = n/kg solvent | x = n₁/(n₁+n₂) | ppm = (mass solute/mass solution)×10⁶\n% yield = actual/theoretical × 100\nEmpirical → molecular: n = molar mass/empirical mass\nLimiting reagent: jo pehle khatam (n/coefficient sabse kam)"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 2, "title": "Introduction to Analytical Chemistry", "tags": "Board+CET", "file": "audio/C11-02-Introduction-to-Analytical-Chemistry.mp4", "formulas": "Flame tests: Na golden yellow | K lilac | Ca brick red | Sr crimson | Ba apple green | Cu blue-green\nCation groups: Gp1 dil HCl (Ag⁺, Pb²⁺) | Gp2 H₂S in acid (Cu²⁺, Pb²⁺) | Gp3 NH₄OH+NH₄Cl (Fe³⁺, Al³⁺) | Gp4 H₂S in alkali (Zn²⁺, Ni²⁺) | Gp5 (NH₄)₂CO₃ (Ba²⁺, Ca²⁺) | Gp6 Mg²⁺, Na⁺, K⁺\nAnion tests: SO₄²⁻ + BaCl₂ white ppt (HCl insoluble) | Cl⁻ + AgNO₃ white ppt (NH₃ soluble) | NO₃⁻ brown ring test | CO₃²⁻ + acid → CO₂ (lime water milky)\nIndicators: phenolphthalein (pink in base, pH 8.3-10) | methyl orange (yellow base, red acid, 3.1-4.4)"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 3, "title": "Basic Analytical Techniques", "tags": "Board+CET; JEE organic me use", "file": "audio/C11-03-Basic-Analytical-Techniques.mp4", "formulas": "Rf = distance spot/distance solvent front\nLassaigne (Na extract): N → +FeSO₄/FeCl₃ → Prussian blue | S → sodium nitroprusside violet | X → AgNO₃ (Cl white, Br pale yellow, I yellow)\nEstimation: C,H by combustion (Liebig) | N by Kjeldahl (NH₃ titration) / Dumas (N₂ volume) | X,S by Carius (AgX / BaSO₄ weighing)\n%N (Kjeldahl) = 1.4 × N × V / mass"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 4, "title": "Structure of Atom", "tags": "Board+CET+JEE", "file": "audio/C11-04-Structure-of-Atom.mp4", "formulas": "e/m electron = 1.76×10¹¹ C/kg | electron charge = 1.6×10⁻¹⁹ C\nRydberg: 1/λ = R(1/n₁² − 1/n₂²) | En = −13.6 Z²/n² eV | rn = 0.53 n²/Z Å\nde Broglie λ = h/mv | Heisenberg Δx·Δp ≥ h/4π\nQuantum numbers: n (1,2,3…), l (0…n−1; s,p,d,f), m (−l…+l), s (±½)\nMax electrons shell = 2n² | subshell = 2(2l+1)\nAufbau (n+l rule), Pauli, Hund\nExceptions: Cr [Ar]3d⁵4s¹ | Cu [Ar]3d¹⁰4s¹"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 5, "title": "Chemical Bonding", "tags": "Board+CET+JEE", "file": "audio/C11-05-Chemical-Bonding.mp4", "formulas": "Formal charge = valence − (lone pair e⁻ + ½ bonding e⁻)\nVSEPR/hybridization:\n sp linear 180° | sp² trigonal planar 120° | sp³ tetrahedral 109.5°\n sp³d trigonal bipyramidal | sp³d² octahedral\n Lone pairs: NH₃ (1 lp, pyramidal 107°), H₂O (2 lp, bent 104.5°)\nBond order = (Nb − Na)/2 | O₂ paramagnetic (MOT), BO = 2\nDipole moment μ = q×d | H-bond with F,O,N"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 6, "title": "Redox Reactions", "tags": "Board+CET+JEE", "file": "audio/C11-06-Redox-Reactions.mp4", "formulas": "Oxidation number rules: free element 0 | F always −1 | O −2 (peroxide −1, OF₂ +2) | H +1 (hydrides −1) | sum = charge\nCommon: Mn in KMnO₄ +7 | Cr in K₂Cr₂O₇ +6 | S in H₂SO₄ +6 | N in HNO₃ +5\nIon-electron method (acidic): balance atoms → O with H₂O → H with H⁺ → charge with e⁻ → combine\nDisproportionation: same element oxidized + reduced (Cl₂ + NaOH)"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 7, "title": "Modern Periodic Table", "tags": "Board+CET+JEE", "file": "audio/C11-07-Modern-Periodic-Table.mp4", "formulas": "Trends (period L→R): radius ↓, IE ↑, EN ↑, non-metallic ↑\n(group top→bottom): radius ↑, IE ↓, EN ↓, metallic ↑\nIE exceptions: N > O (half-filled), Be > B, Mg > Al\nElectron gain enthalpy: Cl most −ve (F anomaly, small size)\nEN (Pauling): F 4.0 > O 3.5 > N/Cl 3.0\nIonic radius: cation < atom < anion; isoelectronic: Z ↑ size ↓"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 8, "title": "Elements of Group 1 and 2 (s-Block)", "tags": "Board+CET; JEE se ab hataye gaye mostly", "file": "audio/C11-08-Elements-of-Group-1-and-2.mp4", "formulas": "Group 1: ns¹ | Group 2: ns²\nReactivity with water ↑ down Gp1 | Li anomalous (small, polarizing)\nDiagonal: Li-Mg, Be-Al\nCompounds: NaOH (Castner-Kellner), Na₂CO₃ (Solvay), washing soda Na₂CO₃·10H₂O, baking soda NaHCO₃\nCaO quicklime | Ca(OH)₂ slaked lime | CaSO₄·2H₂O gypsum | (CaSO₄)₂·H₂O POP\nFlame: Na yellow, K lilac, Ca brick red, Sr crimson, Ba green"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 9, "title": "Elements of Groups 13, 14, 15 (p-Block part 1)", "tags": "Board+CET+JEE", "file": "audio/C11-09-Elements-of-Group-13-14-15.mp4", "formulas": "Boron: borax Na₂B₄O₇·10H₂O | boric acid H₃BO₃ (weak monobasic Lewis acid) | diborane B₂H₆ (3c-2e banana bonds)\nAl: amphoteric (2Al + 2NaOH + 2H₂O → 2NaAlO₂ + 3H₂)\nCarbon: diamond sp³ network | graphite sp² layers conductor | fullerene C₆₀\nInert pair effect: Pb²⁺ > Pb⁴⁺ stability\nHaber: N₂ + 3H₂ ⇌ 2NH₃ (Fe catalyst, ~700 K, 200 atm)\nAmmonia: basic, reducing, complex former\nWhite P: reactive, glows (chemiluminescence); red P: polymeric, stable\nOxoacids of P: H₃PO₂ (monobasic), H₃PO₃ (dibasic), H₃PO₄ (tribasic)\nHNO₃ (Ostwald): NH₃ → NO → NO₂ → HNO₃"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 10, "title": "States of Matter (Gaseous & Liquid)", "tags": "Board+CET; JEE se ab nahi", "file": "audio/C11-10-States-of-Matter.mp4", "formulas": "Boyle: P₁V₁ = P₂V₂ | Charles: V₁/T₁ = V₂/T₂ | Avogadro: V ∝ n\nIdeal gas: PV = nRT | R = 0.0821 L atm/mol K = 8.314 J/mol K\nDalton: P_total = Σpᵢ | moist gas: p_gas = P_total − p_water vapour\nGraham: r₁/r₂ = √(d₂/d₁) = √(M₂/M₁)\nKinetic theory postulates (voice note)\nvan der Waals: (P + an²/V²)(V − nb) = nRT | compression factor Z = PV/nRT\nv_rms = √(3RT/M) | v_mp = √(2RT/M) | v_avg = √(8RT/πM) | ratio 1.22 : 1.13 : 1"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 11, "title": "Adsorption and Colloids", "tags": "Board+CET; JEE se ab nahi", "file": "audio/C11-11-Adsorption-and-Colloids.mp4", "formulas": "Physisorption: v.d.Waals, reversible, multilayer, ↓ with T | Chemisorption: chemical bond, monolayer, specific, ↑ then ↓ with T\nFreundlich: x/m = kP^(1/n)\nColloids 1-1000 nm | Tyndall effect\nLyophilic (reversible, stable) vs lyophobic (irreversible)\nBrownian motion | Electrophoresis (charged colloids)\nHardy-Schulze: coagulating power ∝ valence of opposite ion\nEmulsions: oil-in-water (milk), water-in-oil (butter)\nExamples: sol (paint), gel (jelly), aerosol (fog), foam (soap lather)"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 12, "title": "Chemical Equilibrium", "tags": "Board+CET+JEE", "file": "audio/C11-12-Chemical-Equilibrium.mp4", "formulas": "Kc = [C]^c[D]^d / [A]^a[B]^b | Kp = Kc(RT)^Δn\nΔn = 0 → Kp = Kc | homogeneous/heterogeneous (pure solids, liquids = 1)\nQ < K forward | Q = K equilibrium | Q > K backward\nLe Chatelier: conc ↑ → consume | pressure ↑ → fewer gas moles side | temp ↑ → endothermic direction | catalyst: no shift\nDegree of dissociation α; Kc in terms of α (PCl₅ type): Kc = α²V/(1−α)... table practice\nK for reverse = 1/K | multiplied by n → Kⁿ"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 13, "title": "Nuclear Chemistry and Radioactivity", "tags": "Board+CET; JEE me physics me covered", "file": "audio/C11-13-Nuclear-Chemistry-and-Radioactivity.mp4", "formulas": "α: ⁴₂He (A−4, Z−2) | β⁻: electron (Z+1, n→p) | β⁺: positron (Z−1) | γ: energy only\nDecay law: N = N₀e^(−λt) | T½ = 0.693/λ | t = (T½/0.301) log(N₀/N)\nCarbon dating: ¹⁴C, T½ = 5730 yr\nE = Δm c² | 1 u = 931.5 MeV\nFission: ²³⁵U + n → fragments + 2-3n + energy (chain) | Fusion: H isotopes → He (sun)"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 14, "title": "Basic Principles of Organic Chemistry (GOC)", "tags": "Board+CET+JEE", "file": "audio/C11-14-Basic-Principles-of-Organic-Chemistry.mp4", "formulas": "Functional group priority (high→low): COOH > SO₃H > ester > acyl halide > amide > nitrile > aldehyde > ketone > alcohol > amine > alkyne/alkene\nInductive: −I (NO₂, CN, halogens, COOH) | +I (alkyl, O⁻)\nResonance: +M (lone pair donors: −OH, −NH₂, −OR, halogens) | −M (−NO₂, −CN, −CHO, −COOH)\nHyperconjugation: more α-H → more stable carbocation/alkene\nStability: carbocation 3° > 2° > 1° > methyl | carbanion reverse | radical 3° > 2° > 1°\nAryl/vinyl carbocations unstable | benzyl/allyl resonance stabilized\nElectrophiles: NO₂⁺, Br⁺, carbocations | Nucleophiles: OH⁻, CN⁻, NH₃"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 15, "title": "Hydrocarbons", "tags": "Board+CET+JEE", "file": "audio/C11-15-Hydrocarbons.mp4", "formulas": "Alkane: halogenation (hv, free radical); cracking; aromatization\nAlkene reactions:\n + HX Markovnikov (carbocation) | HBr + peroxide → anti-Markovnikov\n + H₂O/H⁺ → alcohol (Markovnikov) | hydroboration-oxidation → anti-Markovnikov alcohol\n + Br₂/CCl₄ → vicinal dibromide (decolourisation = unsaturation test)\n + cold dil KMnO₄ (Baeyer) → glycol (pink decolourises)\n Ozonolysis: O₃ then Zn/H₂O → carbonyls (locate double bond)\nAlkyne: terminal ≡C−H acidic (NaNH₂, Na) | +Ag(NH₃)₂⁺ white ppt | hydration (HgSO₄/H₂SO₄) → ketone | Lindlar → cis-alkene | Na/liq NH₃ → trans\nBenzene EAS: nitration (HNO₃/H₂SO₄), halogenation (X₂/FeX₃), sulphonation (conc H₂SO₄), Friedel-Crafts alkylation/acylation (RX/RCOCl + AlCl₃)\nDirectors: o/p (activators −OH, −NH₂, −R; halogens deactivating but o/p) | meta (−NO₂, −COOH, −CN, −CHO)\nAromaticity: Hückel 4n+2 π electrons, planar, cyclic"}, {"prefix": "C11", "subject": "Chemistry", "cls": "11", "num": 16, "title": "Chemistry in Everyday Life", "tags": "Board+CET; JEE se ab nahi", "file": "audio/C11-16-Chemistry-in-Everyday-Life.mp4", "formulas": "Analgesics: aspirin, paracetamol (non-narcotic); morphine, heroin (narcotic)\nAntibiotics: penicillin G (narrow), ampicillin/amoxicillin (broad); chloramphenicol, tetracyclines (broad)\nAntiseptic: dettol (chloroxylenol + terpineol), iodine, Bithionol | Disinfectant: phenol (1%), SO₂\nAntacids: NaHCO₃, Mg(OH)₂; cimetidine/ranitidine (H2 blockers), omeprazole (PPI)\nAntihistamines: brompheniramine, cetirizine | Tranquilizers: diazepam, meprobamate\nAntifertility: norethindrone, ethynylestradiol\nSweeteners: saccharin (550×, first), aspartame (heat unstable), sucralose (heat stable), alitame\nPreservatives: sodium benzoate, sorbates, SO₂\nSoap: sodium salts of fatty acids (saponification); hard water scum (Ca/Mg salts)\nDetergents: anionic (LAB), cationic, non-ionic; branched = non-biodegradable"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 1, "title": "Solid State", "tags": "Board+CET; JEE me ab nahi", "file": "audio/C12-01-Solid-State.mp4", "formulas": "Atoms/unit cell: primitive = 1 | BCC = 2 | FCC = 4\nPacking efficiency: simple cubic 52.4% | BCC 68% | FCC/CCP 74% | HCP 74%\nVoids: tetrahedral = 2N | octahedral = N (N atoms me)\nRadius ratio: tetra void 0.225 | octa void 0.414 | cubic void 0.732\nDensity: d = ZM/(a³·Nᴀ), Nᴀ = 6.022×10²³\nEdge-radius: simple a = 2r | BCC a = 4r/√3 | FCC a = 2√2 r\nDefects: Schottky (NaCl, CsCl) density ↓ | Frenkel (AgCl, AgBr, ZnS) density same\nF-centre: electron in anionic vacancy → colour (NaCl yellow)"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 2, "title": "Solutions", "tags": "Board+CET+JEE", "file": "audio/C12-02-Solutions.mp4", "formulas": "Molarity = moles solute/L solution | Molality = moles/kg solvent (temp independent)\nMole fraction x₁ + x₂ = 1 | ppm = mass solute/mass solution × 10⁶\nRaoult: P = x₁P₁° (volatile: P_total = x₁P₁° + x₂P₂°)\nRelative lowering: (P° − P)/P° = x₂ = n₂/(n₁ + n₂)\nΔTb = Kb·m | ΔTf = Kf·m | π = CRT = (n₂/V)RT\nvan't Hoff factor i = observed colligative/calculated\nDissociation: i = 1 + (n−1)α | Association: i = 1 − (1 − 1/n)α\nNaCl, KCl ideal i = 2 | CaCl₂ i = 3 | K₄[Fe(CN)₆] i = 5"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 3, "title": "Ionic Equilibria", "tags": "Board+CET+JEE", "file": "audio/C12-03-Ionic-Equilibria.mp4", "formulas": "Kw = [H⁺][OH⁻] = 10⁻¹⁴ at 25°C | pH = −log[H⁺] | pH + pOH = 14\nWeak acid: [H⁺] = √(Ka·c) | α = √(Ka/c) | pH = ½(pKa − log c)\nKa·Kb = Kw (conjugate pair) | Ka = cα²\nHenderson: pH = pKa + log([salt]/[acid]) | pOH = pKb + log([salt]/[base])\nBuffer capacity max jab [salt] = [acid]\nKsp (AxBy) = x^x · y^y · S^(x+y) | precipitation if ionic product > Ksp\nHydrolysis: salt of weak acid+strong base: pH = ½(pKw + pKa + log c)\n Salt of strong acid+weak base: pH = ½(pKw − pKb − log c)"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 4, "title": "Chemical Thermodynamics", "tags": "Board+CET+JEE", "file": "audio/C12-04-Chemical-Thermodynamics.mp4", "formulas": "ΔU = Q + W (chemistry; W on system) | W = −P_ext ΔV | W_rev = −nRT ln(V₂/V₁)\nΔH = ΔU + Δn_g RT\nHess: ΔH_rxn = ΣΔHf(products) − ΣΔHf(reactants)\nΔS_univ > 0 spontaneous | ΔG = ΔH − TΔS\nΔG < 0 spontaneous | ΔG = 0 equilibrium | ΔG° = −RT ln K = −2.303 RT log K\nBond enthalpy: ΔH = ΣBE(bonds broken) − ΣBE(bonds formed)\nSpontaneity: ΔH −ve, ΔS +ve → hamesha | ΔH +ve, ΔS +ve → high T | ΔH −ve, ΔS −ve → low T"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 5, "title": "Electrochemistry", "tags": "Board+CET+JEE", "file": "audio/C12-05-Electrochemistry.mp4", "formulas": "E°cell = E°cathode − E°anode | ΔG = −nFE | ΔG° = −nFE°\nNernst (25°C): E = E° − (0.059/n) log Q\nEquilibrium: E° = (0.059/n) log K\nConductivity κ = G·(l/A) | Molar conductivity Λm = κ×1000/C\nΛm = Λ°m − A√c (strong); Kohlrausch: Λ°m = Σλ°ions\nFaraday: W = (I·t·M)/(n·F) = Z·I·t | 1 F = 96500 C\nExamples: Daniell cell Zn|Zn²⁺||Cu²⁺|Cu, E° = 1.1 V"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 6, "title": "Chemical Kinetics", "tags": "Board+CET+JEE", "file": "audio/C12-06-Chemical-Kinetics.mp4", "formulas": "Rate = k[A]^x[B]^y | order = x + y\nUnits of k: zero = mol L⁻¹ s⁻¹ | first = s⁻¹ | second = L mol⁻¹ s⁻¹\nZero: [A] = [A]₀ − kt | t½ = [A]₀/2k\nFirst: k = (2.303/t) log([A]₀/[A]) | t½ = 0.693/k\nSecond: 1/[A] = 1/[A]₀ + kt\nArrhenius: k = A e^(−Ea/RT) | log(k₂/k₁) = (Ea/2.303R)(1/T₁ − 1/T₂)\nlog k vs 1/T: slope = −Ea/2.303R"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 7, "title": "Elements of Groups 16, 17, 18", "tags": "Board+CET+JEE", "file": "audio/C12-07-Groups-16-17-18.mp4", "formulas": "Contact process: S → SO₂ (burn) → SO₃ (V₂O₅ catalyst, 450°C) → oleum → H₂SO₄\nH₂SO₄: strong dibasic acid, dehydrating agent (sugar → charcoal), oxidizing hot conc.\nHalogens oxidizing power: F₂ > Cl₂ > Br₂ > I₂\nAcid strength: HF < HCl < HBr < HI | thermal stability reverse\nHF weak acid (H-bonding) | Cl₂ + NaOH (cold) → NaCl + NaOCl | (hot) → NaCl + NaClO₃\nBleaching: Cl₂ by oxidation (permanent), SO₂ by reduction (temporary)\nInterhalogens: ClF₃ (bent T), IF₇ (pentagonal bipyramidal)\nXe compounds: XeF₂ (linear), XeF₄ (square planar), XeF₆ (distorted octahedral), XeO₃ (pyramidal)\nPrep: Xe + F₂ (673 K, 1 bar) → XeF₂ etc."}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 8, "title": "Transition and Inner Transition Elements", "tags": "Board+CET+JEE", "file": "audio/C12-08-Transition-and-Inner-Transition-Elements.mp4", "formulas": "3d series config: Sc [Ar]3d¹4s² … Cr 3d⁵4s¹, Cu 3d¹⁰4s¹ (exceptions)\nMagnetic moment: μ = √(n(n+2)) BM (n = unpaired e⁻)\nColourless: Sc³⁺, Ti⁴⁺, Zn²⁺, Cu⁺ (no unpaired d e⁻)\nKMnO₄ prep: MnO₂ + KOH + O₂ → K₂MnO₄ (green) → (disproportionation/electrolysis) KMnO₄ (purple)\n Acidic: MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O\nK₂Cr₂O₇: dichromate ⇌ chromate (acid/base); Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O\nLanthanoid contraction → Zr ≈ Hf sizes, separation hard\nCommon oxidation states: lanthanides +3; actinides variable"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 9, "title": "Coordination Compounds", "tags": "Board+CET+JEE", "file": "audio/C12-09-Coordination-Compounds.mp4", "formulas": "Naming: ligands alphabetical (di/tri/bis/tris), metal, (oxidation state roman); anionic: -ate\nE.g. [Co(NH₃)₆]Cl₃ = hexaamminecobalt(III) chloride | K₄[Fe(CN)₆] = potassium hexacyanidoferrate(II)\nEAN, hybridization: sp³ tetrahedral | dsp² square planar | sp³d² outer octa | d²sp³ inner octa\nCFT: octa Δo: t₂g lower, eg higher; t₂g^x eg^y counting; CFSE = (−0.4x + 0.6y)Δo\nSpectrochemical series (weak→strong): I⁻ < Br⁻ < Cl⁻ < F⁻ < H₂O < NH₃ < en < CN⁻ < CO\nStrong field → pairing (low spin); weak field → high spin\nTetra: Δt = 4/9 Δo, mostly high spin\nIsomerism: ionization, hydrate, linkage (NO₂/ONO), coordination, geometrical (cis/trans, fac/mer), optical"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 10, "title": "Halogen Derivatives", "tags": "Board+CET+JEE", "file": "audio/C12-10-Halogen-Derivatives.mp4", "formulas": "SN1: rate = k[RX]; 3° > 2° > 1°; carbocation; racemization; polar protic solvent\nSN2: rate = k[RX][Nu]; 1° > 2° > 3°; backside attack; inversion; polar aprotic\nElimination (alc KOH): Saytzeff - more substituted alkene major\nReactivity: R−I > R−Br > R−Cl | vinyl/aryl halide unreactive (partial double bond)\nWurtz: 2RX + 2Na (dry ether) → R−R\nGrignard: RX + Mg (dry ether) → RMgX; +H₂O → RH; +CO₂ then H₃O⁺ → RCOOH; +HCHO → 1° alcohol; +RCHO → 2°; +RCOR → 3°\nFriedel-Crafts (aryl halide + AlCl₃) alkylation/acylation\nUses: CHCl₃ (chloroform, oxidation → phosgene store in dark), DDT, freons"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 11, "title": "Alcohols, Phenols, Ethers", "tags": "Board+CET+JEE", "file": "audio/C12-11-Alcohols-Phenols-Ethers.mp4", "formulas": "Acidity order: phenol > H₂O > alcohol; carboxylic acid > phenol\nEWG on phenol ↑ acidity (picric acid strong); electron donating ↓\nAlcohol prep: alkene hydration (Markovnikov), hydroboration-oxidation (anti-Markovnikov), Grignard + carbonyl, reduction of acids/aldehydes (LiAlH₄)\nOxidation: 1° → aldehyde (PCC) → acid (KMnO₄); 2° → ketone; 3° resists\nLucas test (ZnCl₂/HCl): 3° instant, 2° ~5 min, 1° no reaction at RT\nDehydration (conc H₂SO₄, heat): alkene, Saytzeff\nPhenol: +Br₂ water → 2,4,6-tribromophenol (white ppt)\nKolbe: sodium phenoxide + CO₂ (125°C, pressure) → salicylic acid\nReimer-Tiemann: phenol + CHCl₃ + NaOH → salicylaldehyde\nWilliamson: RONa + R'X → R−O−R' (SN2, primary X best)\nEther cleavage: ROR + HX → RX + ROH; excess HX → 2 RX"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 12, "title": "Aldehydes, Ketones, Carboxylic Acids", "tags": "Board+CET+JEE", "file": "audio/C12-12-Aldehydes-Ketones-Carboxylic-Acids.mp4", "formulas": "Prep aldehydes: Rosenmund (RCOCl + H₂/Pd-BaSO₄), Stephen (RCN + SnCl₂/HCl), Etard (toluene + CrO₂Cl₂), Gatterman-Koch (benzene + CO/HCl/AlCl₃)\nOzonolysis of alkenes → aldehydes/ketones\nNucleophilic addition: +HCN → cyanohydrin; +NaHSO₃ adduct; +ROH → acetal; +NH₃ derivatives (oxime, hydrazone)\nReduction: → alcohol (NaBH₄/LiAlH₄); → alkane: Clemmensen (Zn-Hg/HCl), Wolff-Kishner (NH₂NH₂/KOH)\nOxidation: aldehyde → acid (Tollens/Fehling); ketone resists\nTollens: Ag mirror (aldehydes only) | Fehling/Benedict: brick red (aliphatic aldehydes)\nAldol: 2 molecules with α-H (dil NaOH) → β-hydroxy, heat → α,β-unsaturated\nCannizzaro: no α-H (HCHO, PhCHO) + conc NaOH → alcohol + acid salt\nIodoform (I₂/NaOH): CH₃CO- or CH₃CH(OH)- → CHI₃ yellow ppt\nCarboxylic acids: acidity RCOOH > phenol > H₂O > alcohol; EWG ↑, EDG ↓\nPrep: oxidation, Grignard + CO₂, nitrile hydrolysis\nReactions: esterification (ROH/H⁺); HVZ (Br₂/red P → α-bromo acid); decarboxylation (soda lime)\nDerivatives reactivity: acyl chloride > anhydride > ester > amide\nHoffmann bromamide: RCONH₂ + Br₂ + KOH → RNH₂ (one C less)"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 13, "title": "Amines", "tags": "Board+CET+JEE", "file": "audio/C12-13-Amines.mp4", "formulas": "Basicity (aqueous): (C₂H₅)₂NH > (C₂H₅)₃N > C₂H₅NH₂ > NH₃ > aniline\nAniline < aliphatic (lone pair in resonance); EWG on ring ↓ basicity\nPrep: nitro reduction (Sn/HCl, Fe/HCl, H₂/Ni); nitrile/amide reduction (LiAlH₄); Gabriel (1° only); Hoffmann bromamide\nCarbylamine test (1° amine): + CHCl₃ + alc KOH → foul isocyanide\nHinsberg (C₆H₅SO₂Cl): 1° soluble in KOH, 2° insoluble, 3° no reaction\nDiazotization: ArNH₂ + NaNO₂ + HCl, 0-5°C → ArN₂⁺Cl⁻\nConversions of ArN₂⁺: H₃PO₂/H₂O → benzene; CuCl → Cl; CuBr → Br (Sandmeyer); CuCN → CN; KI → I; HBF₄/heat → F (Balz-Schiemann); H₂O/warm → phenol\nCoupling: + phenol (alkaline) → p-hydroxyazobenzene (orange dye)\nDirecting: −NH₂ strong activator, o/p director (bromination → 2,4,6-tribromo; protect as acetanilide for mono)"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 14, "title": "Biomolecules", "tags": "Board+CET+JEE", "file": "audio/C12-14-Biomolecules.mp4", "formulas": "Glucose: C₆H₁₂O₆, aldohexose; open chain (Fischer) ⇌ α/β pyranose; mutarotation\nFructose: ketohexose, sweetest\nGlycosidic bond: sucrose = α-glucose C1 − C2 β-fructose (non-reducing); maltose = glc α1→4 glc (reducing); lactose = gal β1→4 glc (reducing)\nStarch = amylose (α1→4, helix) + amylopectin (α1→4 + α1→6 branches); cellulose β1→4 (indigestible by humans)\nAmino acids: NH₂−CHR−COOH; zwitterion; isoelectric point; essential amino acids ~10\nPeptide bond: −CO−NH− (amide)\nProtein levels: 1° sequence; 2° α-helix/β-sheet (H-bonds); 3° folding (disulfide, ionic, H-bond, hydrophobic); 4° subunits\nDenaturation: 2°/3° lost, 1° intact (heat, acid)\nDNA: deoxyribose, A-T (2 H-bonds), G-C (3 H-bonds), double helix; Chargaff: A=T, G=C\nRNA: ribose, U instead of T, single-stranded (mRNA, tRNA, rRNA)\nVitamins: A D E K fat-soluble; B complex, C water-soluble\nDeficiency: A night blindness | D rickets | C scurvy | B1 beriberi | B12 pernicious anaemia\nHormones: insulin (protein), adrenaline (amine), steroids"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 15, "title": "Polymers", "tags": "Board+CET; JEE me ab nahi", "file": "audio/C12-15-Polymers.mp4", "formulas": "Addition: polythene (ethylene), PVC (vinyl chloride), teflon (CF₂=CF₂), polystyrene, PMMA, Buna-S (butadiene+styrene), Buna-N (butadiene+acrylonitrile)\nCondensation: nylon-6,6 (hexamethylenediamine + adipic acid); nylon-6 (caprolactam); terylene/dacron (ethylene glycol + terephthalic acid); bakelite (phenol + formaldehyde); melamine\nRubber: natural = cis-polyisoprene; neoprene = chloroprene; vulcanization with S (cross-links)\nBiodegradable: PHBV (3-hydroxybutyrate + 3-hydroxyvalerate), nylon-2-nylon-6 (glycine + aminocaproic acid)"}, {"prefix": "C12", "subject": "Chemistry", "cls": "12", "num": 16, "title": "Green Chemistry & Nanochemistry", "tags": "Board+CET; JEE me nahi", "file": "audio/C12-16-Green-Chemistry-and-Nanochemistry.mp4", "formulas": "Atom economy = (molar mass desired product / Σ molar mass all reactants) × 100\n12 principles themes: prevention, atom economy, less hazardous, safer solvents, energy efficiency, renewable feedstock, catalysis, reduce derivatives, design for degradation, real-time analysis, safer chemistry for accident prevention\nExamples: CO₂ dry cleaning; H₂O₂ bleaching; water as solvent; bio-catalysts\nNanoscale: 1-100 nm | high surface/volume ratio → new optical/catalytic properties\nSynthesis: top-down (ball milling, lithography), bottom-up (chemical reduction, sol-gel)\nUses: drug delivery, TiO₂/ZnO sunscreens, catalysts, water purification, stain-resistant fabrics"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 1, "title": "Angle and its Measurement", "tags": "Board+CET+JEE basics", "file": "audio/M11-01-Angle-and-Measurement.mp4", "formulas": "π rad = 180° | 1° = π/180 rad | 1 rad ≈ 57°17′45″\nArc: l = rθ | Sector area = ½r²θ (θ in radians)\nCoterminal: θ ± 360°n (or ±2πn)"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 2, "title": "Trigonometry 1", "tags": "Board+CET+JEE", "file": "audio/M11-02-Trigonometry-1.mp4", "formulas": "sin²θ + cos²θ = 1 | 1 + tan²θ = sec²θ | 1 + cot²θ = cosec²θ\nASTC signs: Q1 all +, Q2 sin, Q3 tan, Q4 cos\nsin(A±B) = sinA cosB ± cosA sinB | cos(A±B) = cosA cosB ∓ sinA sinB\ntan(A±B) = (tanA ± tanB)/(1 ∓ tanA tanB)\nsin2θ = 2 sinθ cosθ | cos2θ = cos²−sin² = 2cos²−1 = 1−2sin² | tan2θ = 2tanθ/(1−tan²θ)\n1 + cos2θ = 2cos²θ | 1 − cos2θ = 2sin²θ\nsin3θ = 3sinθ − 4sin³θ | cos3θ = 4cos³θ − 3cosθ | tan3θ = (3t−t³)/(1−3t²)\nSum→product:\n sinC + sinD = 2 sin((C+D)/2) cos((C−D)/2) | sinC − sinD = 2 cos((C+D)/2) sin((C−D)/2)\n cosC + cosD = 2 cos((C+D)/2) cos((C−D)/2) | cosC − cosD = −2 sin((C+D)/2) sin((C−D)/2)\nProduct→sum: 2sinAcosB = sin(A+B)+sin(A−B) | 2cosAsinB = sin(A+B)−sin(A−B)\n 2cosAcosB = cos(A+B)+cos(A−B) | 2sinAsinB = cos(A−B)−cos(A+B)\nValues table (0°,30°,45°,60°,90°) - yaad honi chahiye"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 3, "title": "Trigonometry 2", "tags": "Board+CET+JEE", "file": "audio/M11-03-Trigonometry-2.mp4", "formulas": "Sine rule: a/sinA = b/sinB = c/sinC = 2R\nCosine rule: cosA = (b²+c²−a²)/2bc (cyclic)\nProjection: a = b cosC + c cosB\nArea: ½ab sinC = √[s(s−a)(s−b)(s−c)] (Heron), s = (a+b+c)/2 | also abc/4R, r·s\nR = a/(2 sinA) = abc/4Δ | r = Δ/s\nHalf angles: sin(A/2) = √[(s−b)(s−c)/bc], cos(A/2) = √[s(s−a)/bc]"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 4, "title": "Determinants and Matrices", "tags": "Board+CET+JEE", "file": "audio/M11-04-Determinants-and-Matrices.mp4", "formulas": "2×2: |a b; c d| = ad − bc\n3×3 expansion (signs +−+; −+−; +−+)\nProperties: swap rows → −det | identical rows → 0 | common factor out | Ri+kRj unchanged | det(AB) = detA·detB | det(kA) = kⁿdetA\nCramer (2 eq): x = Dx/D, y = Dy/D; D≠0 unique, D=0 check Dx,Dy\nArea triangle = ½|x₁(y₂−y₃)+x₂(y₃−y₁)+x₃(y₁−y₂)| = ½|det|"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 5, "title": "Straight Line", "tags": "Board+CET+JEE", "file": "audio/M11-05-Straight-Line.mp4", "formulas": "m = tanθ = (y₂−y₁)/(x₂−x₁) | parallel m₁=m₂ | perpendicular m₁m₂ = −1\nForms: y = mx+c | y−y₁ = m(x−x₁) | two-point (y−y₁)/(x−x₁) = (y₂−y₁)/(x₂−x₁)\n intercept x/a + y/b = 1 | normal x cosα + y sinα = p | general ax+by+c = 0, m = −a/b\nDistance point-line: |ax₁+by₁+c|/√(a²+b²) | parallel lines: |c₁−c₂|/√(a²+b²)\nAngle: tanθ = |(m₁−m₂)/(1+m₁m₂)|\nFamily: L₁ + λL₂ = 0\nConcurrency: determinant of coefficients = 0"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 6, "title": "Circle", "tags": "Board+CET+JEE", "file": "audio/M11-06-Circle.mp4", "formulas": "Standard: (x−h)² + (y−k)² = r² | General: x²+y²+2gx+2fy+c = 0, centre (−g,−f), r = √(g²+f²−c)\nDiameter form: (x−x₁)(x−x₂) + (y−y₁)(y−y₂) = 0\nTangent at (x₁,y₁): xx₁ + yy₁ + g(x+x₁) + f(y+y₁) + c = 0\nCondition line y=mx+c tangent: c² = a²(1+m²) (circle x²+y²=a²)\nTangent length from external point: √(x₁²+y₁²+2gx₁+2fy₁+c)\nLine-circle: d(centre, line) vs r (< r secant, = tangent, > none)"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 7, "title": "Conic Sections", "tags": "Board+CET+JEE", "file": "audio/M11-07-Conic-Sections.mp4", "formulas": "Parabola y² = 4ax: focus (a,0), directrix x = −a, LR = 4a\n (variants: x²=4ay, y²=−4ax, x²=−4ay)\nEllipse x²/a² + y²/b² = 1 (a>b): foci (±ae,0), e² = 1 − b²/a², LR = 2b²/a, directrices x = ±a/e\n SP + S′P = 2a\nHyperbola x²/a² − y²/b² = 1: foci (±ae,0), e² = 1 + b²/a², LR = 2b²/a, asymptotes y = ±(b/a)x\n |SP − S′P| = 2a | rectangular: a = b, e = √2, xy = c²\nTangents (slope form): parabola y = mx + a/m | ellipse y = mx ± √(a²m²+b²) | hyperbola y = mx ± √(a²m²−b²)"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 8, "title": "Measures of Dispersion (Statistics)", "tags": "Board+CET+JEE", "file": "audio/M11-08-Measures-of-Dispersion.mp4", "formulas": "Mean (assumed): x̄ = A + (Σfᵢdᵢ/N)h\nMedian: l + (N/2 − cf)/f × h | Mode: l + (f₁−f₀)/(2f₁−f₀−f₂) × h\nQuartile deviation = (Q₃−Q₁)/2\nMean deviation = Σ|xᵢ−x̄|/n (or about median)\nVariance σ² = Σ(xᵢ−x̄)²/n = Σx²/n − x̄² | grouped: Σf(xᵢ−x̄)²/N\nSD σ | CV = σ/x̄ × 100 (lower CV = more consistent)\nStep deviation: σ² = h²[Σfd²/N − (Σfd/N)²]"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 9, "title": "Probability", "tags": "Board+CET+JEE", "file": "audio/M11-09-Probability-11.mp4", "formulas": "P(E) = favourable/total | 0 ≤ P ≤ 1 | P(E) + P(E′) = 1\nAddition: P(A∪B) = P(A)+P(B)−P(A∩B) | exclusive: P(A∩B) = 0\nConditional: P(A|B) = P(A∩B)/P(B) | multiplication: P(A∩B) = P(B)·P(A|B)\nIndependent: P(A∩B) = P(A)P(B)\nAt least one: 1 − P(none)\nDeck: 52 cards, 4 suits (13 each), 26 red/26 black, 12 face cards, 4 aces\nOdds in favour = P(E):P(E′)"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 10, "title": "Complex Numbers", "tags": "Board+CET+JEE", "file": "audio/M11-10-Complex-Numbers.mp4", "formulas": "i² = −1; powers cycle i, −1, −i, 1\nz = a+ib | conjugate z̄ = a−ib | |z| = √(a²+b²) | z·z̄ = |z|²\nDivision: multiply by conjugate\narg z: tan⁻¹(b/a) quadrant-wise, principal (−π, π]\nPolar: z = r(cosθ + i sinθ) | z₁z₂: r₁r₂, θ₁+θ₂ | z₁/z₂: r₁/r₂, θ₁−θ₂\nDe Moivre: (cosθ + i sinθ)ⁿ = cos nθ + i sin nθ\nCube roots of unity: 1, ω, ω² | 1+ω+ω² = 0, ω³ = 1, ω = (−1+i√3)/2\nQuadratic: D<0 → x = (−b ± i√|D|)/2a"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 11, "title": "Sequences and Series", "tags": "Board+CET+JEE", "file": "audio/M11-11-Sequences-and-Series.mp4", "formulas": "AP: aₙ = a + (n−1)d | Sₙ = n/2[2a + (n−1)d] = n/2(a + l)\nGP: aₙ = arⁿ⁻¹ | Sₙ = a(rⁿ−1)/(r−1), r≠1 | S∞ = a/(1−r), |r|<1\nAM = (a+b)/2 | GM = √(ab) | HM = 2ab/(a+b) | AM ≥ GM ≥ HM | GM² = AM·HM\nΣn = n(n+1)/2 | Σn² = n(n+1)(2n+1)/6 | Σn³ = [n(n+1)/2]²\nAGP: sum by multiplying by r and subtracting\nTelescoping: partial fractions then cancel"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 12, "title": "Permutations and Combinations", "tags": "Board+CET+JEE", "file": "audio/M11-12-Permutations-and-Combinations.mp4", "formulas": "Multiplication rule (and) / Addition rule (or)\nn! = n(n−1)…1 | 0! = 1\nnPr = n!/(n−r)! | with repetition nʳ\nnCr = n!/(r!(n−r)!) | nCr = nC(n−r) | nCr + nC(r−1) = ⁿ⁺¹Cr\nCircular: (n−1)! | identical items: n!/(p!q!r!)\nΣnCr = 2ⁿ\nCommittees with constraints, words, digits - templates yaad"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 13, "title": "Methods of Induction & Binomial Theorem", "tags": "Board+CET; Induction JEE se hata, Binomial JEE me hai", "file": "audio/M11-13-Induction-and-Binomial.mp4", "formulas": "Induction: base n=1 → assume n=k → prove n=k+1\nBinomial: (x+a)ⁿ = Σ ⁿCᵣ xⁿ⁻ʳ aʳ | general term T(r+1) = ⁿCᵣ xⁿ⁻ʳ aʳ\nMiddle: n even → (n/2+1)th | n odd → ((n+1)/2)th & ((n+3)/2)th\nΣⁿCᵣ = 2ⁿ | even coeff sum = odd coeff sum = 2ⁿ⁻¹\nTerm independent of x: put power of x = 0\nGreatest term: ratio T(r+1)/T(r) ≥ 1 solve\n(1+x)ⁿ approximations for divisibility (e.g., 6ⁿ − 5n remainder 1)"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 14, "title": "Sets and Relations", "tags": "Board+CET+JEE", "file": "audio/M11-14-Sets-and-Relations.mp4", "formulas": "Power set: 2ⁿ subsets\nn(A∪B) = n(A)+n(B)−n(A∩B)\nn(A∪B∪C) = n(A)+n(B)+n(C)−n(A∩B)−n(B∩C)−n(C∩A)+n(A∩B∩C)\nDe Morgan: (A∪B)′ = A′∩B′ | (A∩B)′ = A′∪B′\nA×B: |A×B| = |A||B|\nRelation types: reflexive (aRa ∀a), symmetric (aRb⟹bRa), transitive (aRb,bRc⟹aRc), equivalence = all three"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 15, "title": "Functions", "tags": "Board+CET+JEE", "file": "audio/M11-15-Functions.mp4", "formulas": "Domain rules: 1/f → f≠0 | √f → f≥0 | log f → f>0\nOne-one (horizontal line test), onto (range = codomain), bijective → inverse exists\nfog(x) = f(g(x)) | f⁻¹ graph = reflection in y = x\n|x| modulus | [x] greatest integer (step) | sgn(x) = x/|x|\nEven: f(−x)=f(x) | Odd: f(−x)=−f(x)\nTransformations: f(x)+a up, f(x+a) left, a·f(x) stretch, f(ax) squeeze, |f(x)| reflect below-axis part up"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 16, "title": "Limits", "tags": "Board+CET+JEE", "file": "audio/M11-16-Limits.mp4", "formulas": "lim exists ⟺ LHL = RHL\nStandard limits:\n lim(x→0) sin x/x = 1 | tan x/x = 1 | (1−cos x)/x = 0 | (eˣ−1)/x = 1\n log(1+x)/x = 1 | (aˣ−1)/x = ln a | (xⁿ−aⁿ)/(x−a) = naⁿ⁻¹\n lim(n→∞) (1+1/n)ⁿ = e | lim(x→0) (1+x)^(1/x) = e\nMethods: factorize, rationalize, standard forms, divide by highest power (x→∞)"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 17, "title": "Continuity", "tags": "Board+CET+JEE", "file": "audio/M11-17-Continuity.mp4", "formulas": "Continuous at c: f(c) defined, lim exists, lim = f(c)\nRemovable / jump / infinite discontinuity\nPolynomials, sin, cos, eˣ continuous everywhere | |x| continuous, not differentiable at 0\nIVT: f continuous on [a,b], k between f(a), f(b) → ∃c, f(c) = k (root existence)\nPiecewise continuity: match LHL = RHL = f(c) at boundaries → unknown constants"}, {"prefix": "M11", "subject": "Maths", "cls": "11", "num": 18, "title": "Differentiation (11th)", "tags": "Board+CET+JEE", "file": "audio/M11-18-Differentiation-11.mp4", "formulas": "f′(x) = lim(h→0) [f(x+h) − f(x)]/h\nd/dx xⁿ = nxⁿ⁻¹ | (sin)′ = cos | (cos)′ = −sin | (tan)′ = sec²\n (eˣ)′ = eˣ | (ln x)′ = 1/x | (aˣ)′ = aˣ ln a\n(uv)′ = u′v + uv′ | (u/v)′ = (u′v−uv′)/v² | chain: dy/dx = dy/du·du/dx\nDifferentiable ⟹ continuous (converse false: |x| at 0)\nd/dx f⁻¹(y) = 1/f′(x)"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 1, "title": "Mathematical Logic", "tags": "Board+CET", "file": "audio/M12-01-Mathematical-Logic.mp4", "formulas": "Connectives: ∧ (and), ∨ (or), ~ (not), → (if-then), ↔ (iff)\nTruth: p∧q true only if both T | p∨q false only if both F | p→q false only when p=T,q=F | p↔q true when same\np→q ≡ ~p∨q | ~(p∧q) ≡ ~p∨~q | ~(p∨q) ≡ ~p∧~q (De Morgan)\nConverse of p→q: q→p | Inverse: ~p→~q | Contrapositive: ~q→~p (≡ original)\nTautology: always T | Contradiction: always F\nNegation of ∀x p(x): ∃x ~p(x) | Negation of ∃x p(x): ∀x ~p(x)\nDual: interchange ∧↔∨ and t↔c"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 2, "title": "Matrices", "tags": "Board+CET+JEE", "file": "audio/M12-02-Matrices.mp4", "formulas": "(AB)ᵀ = BᵀAᵀ | (AB)⁻¹ = B⁻¹A⁻¹ | A(adj A) = |A|I\nA⁻¹ = adj A / |A| (exists iff |A| ≠ 0)\nSymmetric: Aᵀ = A | Skew: Aᵀ = −A | A = ½(A+Aᵀ) + ½(A−Aᵀ)\n|AB| = |A||B| | |kA| = kⁿ|A| (order n) | |adj A| = |A|ⁿ⁻¹\n3×3 determinant expansion along row/col\nProperties: row swap → sign change; common factor out; Ri → Ri + kRj unchanged; two identical rows → 0\nArea of triangle = ½ |det of [x₁ y₁ 1; x₂ y₂ 1; x₃ y₃ 1]|\nSystem AX = B → X = A⁻¹B; Cramer: x = D₁/D etc."}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 3, "title": "Trigonometric Functions", "tags": "Board+CET+JEE", "file": "audio/M12-03-Trigonometric-Functions.mp4", "formulas": "Principal ranges: sin⁻¹ [−π/2, π/2] | cos⁻¹ [0, π] | tan⁻¹ (−π/2, π/2) | cosec⁻¹ [−π/2,π/2]−{0} | sec⁻¹ [0,π]−{π/2} | cot⁻¹ (0, π)\nsin⁻¹(−x) = −sin⁻¹x | cos⁻¹(−x) = π − cos⁻¹x | tan⁻¹(−x) = −tan⁻¹x\nsin⁻¹x + cos⁻¹x = π/2 | tan⁻¹x + tan⁻¹y = tan⁻¹((x+y)/(1−xy)) (xy<1)\ntan⁻¹x + cot⁻¹x = π/2 | 2tan⁻¹x = sin⁻¹(2x/(1+x²)) = cos⁻¹((1−x²)/(1+x²)) = tan⁻¹(2x/(1−x²))\nGeneral solutions:\n sin x = sin y → x = nπ + (−1)ⁿy | cos x = cos y → x = 2nπ ± y\n tan x = tan y → x = nπ + y | sin x = 0 → x = nπ | cos x = 0 → x = (2n+1)π/2"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 4, "title": "Pair of Straight Lines", "tags": "Board+CET", "file": "audio/M12-04-Pair-of-Straight-Lines.mp4", "formulas": "ax² + 2hxy + by² = 0 represents pair through origin if h² ≥ ab\nSlopes: m₁ + m₂ = −2h/b, m₁m₂ = a/b\nAngle: tanθ = |2√(h²−ab)/(a+b)| | coincident: h² = ab | perpendicular: a + b = 0\nGeneral: ax²+2hxy+by²+2gx+2fy+c = 0 is pair if abc + 2fgh − af² − bg² − ch² = 0\nAngle bisectors: (x²−y²)/(a−b) = xy/h"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 5, "title": "Vectors", "tags": "Board+CET+JEE", "file": "audio/M12-05-Vectors.mp4", "formulas": "a·b = |a||b|cosθ = a₁b₁+a₂b₂+a₃b₃ | a·b = 0 ⟺ perpendicular\na×b = |a||b|sinθ n̂ = |i j k; a₁ a₂ a₃; b₁ b₂ b₃| | a×b = 0 ⟺ parallel\n|a×b| = area of parallelogram; ½|a×b| = triangle\nProjection of a on b = a·b/|b| | scalar component\nSection formula: r = (mb + na)/(m+n) (internal m:n)\n[a b c] = a·(b×c) = volume | = 0 ⟺ coplanar\na×(b×c) = (a·c)b − (a·b)c\nWork = F·d | Torque = r×F"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 6, "title": "Line and Plane (3D Geometry)", "tags": "Board+CET+JEE", "file": "audio/M12-06-Line-and-Plane.mp4", "formulas": "Line: r = a + λb | symmetric: (x−x₁)/l = (y−y₁)/m = (z−z₁)/n\nDirection cosines: l² + m² + n² = 1; ratios ∝ cosines\nAngle between lines: cosθ = (b₁·b₂)/(|b₁||b₂|)\nPlane: r·n = d | a(x−x₁)+b(y−y₁)+c(z−z₁) = 0 | intercept form x/a + y/b + z/c = 1\nDistance of point (x₁,y₁,z₁) from plane ax+by+cz+d=0: |ax₁+by₁+cz₁+d|/√(a²+b²+c²)\nAngle between planes: cosθ = (n₁·n₂)/(|n₁||n₂|)\nAngle line-plane: sinθ = |b·n|/(|b||n|)\nCoplanar lines: (a₂−a₁)·(b₁×b₂) = 0\nShortest distance (skew): |(a₂−a₁)·(b₁×b₂)|/|b₁×b₂|"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 7, "title": "Linear Programming", "tags": "Board+CET+JEE Main", "file": "audio/M12-07-Linear-Programming.mp4", "formulas": "Steps: variables → objective (max/min z = ax+by) → constraints → graph feasible region → corner points → evaluate z\nCorner point theorem: optimum at vertex (bounded region)\nUnbounded: check open half-plane ax+by </> optimum value for other solutions"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 8, "title": "Differentiation", "tags": "Board+CET+JEE", "file": "audio/M12-08-Differentiation.mp4", "formulas": "d/dx xⁿ = nxⁿ⁻¹ | (sin x)′ = cos x | (cos x)′ = −sin x | (tan x)′ = sec²x\n(sec x)′ = sec x tan x | (cosec x)′ = −cosec x cot x | (cot x)′ = −cosec²x\n(eˣ)′ = eˣ | (aˣ)′ = aˣ ln a | (ln x)′ = 1/x | (log_a x)′ = 1/(x ln a)\nChain: dy/dx = dy/du · du/dx | Product: (uv)′ = u′v + uv′ | Quotient: (u/v)′ = (u′v − uv′)/v²\nParametric: dy/dx = (dy/dt)/(dx/dt)\nInverse trig: (sin⁻¹x)′ = 1/√(1−x²) | (cos⁻¹x)′ = −1/√(1−x²) | (tan⁻¹x)′ = 1/(1+x²)\n (cot⁻¹x)′ = −1/(1+x²) | (sec⁻¹x)′ = 1/(|x|√(x²−1)) | (cosec⁻¹x)′ = −1/(|x|√(x²−1))\nLogarithmic diff: for y = u^v, ln y = v ln u\nRolle: f cont [a,b], diff (a,b), f(a)=f(b) → ∃c, f′(c)=0\nLMVT: ∃c, f′(c) = (f(b)−f(a))/(b−a)"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 9, "title": "Applications of Derivatives", "tags": "Board+CET+JEE", "file": "audio/M12-09-Applications-of-Derivatives.mp4", "formulas": "Tangent: y − y₁ = m(x − x₁), m = dy/dx | Normal: slope −1/m\nApproximation: Δy ≈ (dy/dx)Δx | % error = (Δx/x)×100\nRate: differentiate relation w.r.t. t\nIncreasing: f′(x) > 0 | Decreasing: f′(x) < 0\nMax/Min: f′(c) = 0; f″(c) < 0 max, f″(c) > 0 min | First derivative test: sign change +→− max, −→+ min\nAbsolute max/min on [a,b]: check critical points + endpoints\nInflection: f″ changes sign"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 10, "title": "Indefinite Integration", "tags": "Board+CET+JEE", "file": "audio/M12-10-Indefinite-Integration.mp4", "formulas": "∫xⁿ dx = xⁿ⁺¹/(n+1) | ∫1/x = ln|x| | ∫eˣ = eˣ | ∫aˣ = aˣ/ln a\n∫sin = −cos | ∫cos = sin | ∫sec² = tan | ∫cosec² = −cot | ∫sec tan = sec | ∫cosec cot = −cosec\n∫dx/√(1−x²) = sin⁻¹x | ∫dx/(1+x²) = tan⁻¹x | ∫dx/(x√(x²−1)) = sec⁻¹x\n∫tan = ln|sec x| | ∫cot = ln|sin x| | ∫sec = ln|sec+tan| | ∫cosec = ln|cosec−cot|\n∫dx/(x²−a²) = (1/2a) ln|(x−a)/(x+a)| | ∫dx/(a²−x²) = (1/2a) ln|(a+x)/(a−x)|\n∫dx/√(x²±a²) = ln|x + √(x²±a²)| | ∫dx/√(a²−x²) = sin⁻¹(x/a)\n∫√(x²±a²) dx = (x/2)√(x²±a²) ± (a²/2) ln|x+√(x²±a²)|\n∫√(a²−x²) dx = (x/2)√(a²−x²) + (a²/2) sin⁻¹(x/a)\nBy parts: ∫u v = u∫v − ∫(u′∫v); ILATE order\n∫eˣ[f(x)+f′(x)] dx = eˣf(x)\nPartial fractions: linear (A/(x−a)), repeated, quadratic ((Ax+B)/(x²+bx+c))"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 11, "title": "Definite Integration", "tags": "Board+CET+JEE", "file": "audio/M12-11-Definite-Integration.mp4", "formulas": "∫ₐᵇ f = F(b) − F(a)\nProperties:\n ∫ₐᵇ f(x)dx = ∫ₐᵇ f(t)dt\n ∫ₐᵇ f = −∫ᵦₐ f | ∫ₐᵇ = ∫ₐᶜ + ∫ᶜᵇ\n KING: ∫₀ᵃ f(x)dx = ∫₀ᵃ f(a−x)dx\n ∫₀²ᵃ f = ∫₀ᵃ[f(x)+f(2a−x)]dx\n Even: ∫₋ₐᵃ f = 2∫₀ᵃ f | Odd: ∫₋ₐᵃ f = 0\nLimit of sum: ∫ₐᵇ f dx = lim h→0 h[f(a)+f(a+h)+…+f(a+(n−1)h)], h=(b−a)/n"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 12, "title": "Applications of Definite Integration (Area)", "tags": "Board+CET+JEE", "file": "audio/M12-12-Applications-of-Definite-Integration.mp4", "formulas": "Area under y=f(x) above x-axis: A = ∫ₐᵇ y dx | below axis: |∫|\nBetween curves: A = ∫ₐᵇ (y_upper − y_lower) dx (a,b = intersections)\nW.r.t. y: A = ∫cᵈ x dy\nCircle x²+y²=a²: area = πa² | Ellipse x²/a²+y²/b²=1: πab\nParabola segment (y²=4ax cut by latus rectum): 8a²/3"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 13, "title": "Differential Equations", "tags": "Board+CET+JEE", "file": "audio/M12-13-Differential-Equations.mp4", "formulas": "Order = highest derivative | Degree = power of highest derivative (polynomial form)\nVariable separable: ∫g(y)dy = ∫f(x)dx + C\nHomogeneous: put y = vx, dy/dx = v + x dv/dx\nLinear: dy/dx + Py = Q → IF = e^∫Pdx → y·IF = ∫Q·IF dx + C\n (dx/dy + Px = Q form bhi)\nGrowth/decay: dN/dt ∝ N → N = N₀e^(kt)\nNewton cooling: dT/dt = −k(T − T₀)"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 14, "title": "Probability Distribution", "tags": "Board+CET+JEE", "file": "audio/M12-14-Probability-Distributions.mp4", "formulas": "P(X=xᵢ) = pᵢ, Σpᵢ = 1, 0 ≤ pᵢ ≤ 1\nMean E(X) = μ = Σxᵢpᵢ\nVariance = E(X²) − [E(X)]² = Σxᵢ²pᵢ − μ² | SD σ = √Var\nE(aX+b) = aE(X)+b | Var(aX+b) = a²Var(X)"}, {"prefix": "M12", "subject": "Maths", "cls": "12", "num": 15, "title": "Bernoulli Trials & Binomial Distribution", "tags": "Board+CET+JEE", "file": "audio/M12-15-Bernoulli-Trials-Binomial-Distribution.mp4", "formulas": "P(X = r) = ⁿCᵣ pʳ qⁿ⁻ʳ, q = 1−p, by V volts: λ = h/√(2meV) ≈ 12.27/√V Å\nc = 3×10⁸ m/s; hc ≈ 12400 eV·Å (1240 eV·nm)"}, {"prefix": "P12", "subject": "Physics", "cls": "12", "num": 15, "title": "Structure of Atoms and Nuclei", "tags": "Board+CET+JEE", "file": "audio/P12-15-Atoms-and-Nuclei.mp4", "formulas": "Bohr: mvr = nh/2π | rn = 0.53 n² Å (H) | En = −13.6/n² eV\nVelocity vn ∝ 1/n | frequency of revolution ∝ 1/n³\nRydberg: 1/λ = R(1/n₁² − 1/n₂²), R = 1.097×10⁷ m⁻¹\nSeries: Lyman n₁=1 (UV), Balmer n₁=2 (visible), Paschen 3, Brackett 4, Pfund 5 (IR)\nNucleus: R = R₀A^(1/3), R₀ = 1.2×10⁻¹⁵ m\nBE = Δm c² | 1 u = 931.5 MeV | BE/A max ≈ 8.8 MeV at Fe-56\nDecay: N = N₀ e^(−λt) | T½ = 0.693/λ | mean life τ = 1/λ\nActivity A = λN = A₀ e^(−λt)\nα: He nucleus, −4A −2Z | β⁻: −1u +1Z (n→p+e⁻) | γ: no change"}, {"prefix": "P12", "subject": "Physics", "cls": "12", "num": 16, "title": "Semiconductor Devices", "tags": "Board+CET+JEE", "file": "audio/P12-16-Semiconductor-Devices.mp4", "formulas": "Energy gap: Si 1.1 eV | Ge 0.7 eV\nne·nh = ni² (mass action)\nForward bias R low, reverse R high | knee voltage Si ≈ 0.7 V, Ge ≈ 0.3 V\nRectifier: half-wave 1 diode; full-wave 2 diodes (centre-tap); bridge 4 diodes\nZener: voltage regulator in reverse breakdown\nTransistor: IE = IB + IC | α = IC/IE | β = IC/IB | β = α/(1 − α)\nLogic gates truth table:\n AND: Y=1 only if A=B=1 | OR: Y=0 only if A=B=0 | NOT: inverts\n NAND = AND+NOT (universal) | NOR = OR+NOT (universal) | XOR: 1 when inputs differ\nPhysics 12th companion END. Voice notes me sirf concepts, sab formulas yahan."}];
const main = document.getElementById('main');
const tabs = document.querySelectorAll('.tab');
let curCls = '12';
document.getElementById('total').textContent = DATA.length;

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  main.innerHTML = '';
  const subs = ['Physics','Chemistry','Maths'];
  for(const s of subs){
    const items = DATA.filter(c => c.cls === curCls && c.subject === s &&
      (!q || (c.title+' '+c.tags).toLowerCase().includes(q)));
    if(!items.length) continue;
    const sec = document.createElement('section');
    sec.className = 'subject';
    sec.innerHTML = `<div class="subj-head"><span class="chip ${s[0]}">${s[0]}</span><h2>${s}</h2><span class="count">${items.length} chapters</span></div>`;
    for(const c of items){
      const d = document.createElement('div');
      d.className = 'chap';
      d.innerHTML = `<h3><span class="chnum">Ch ${c.num}</span>${c.title}</h3>
        <div class="tags">${c.tags}</div>
        <audio controls preload="none" src="${c.file}"></audio>
        ${c.formulas ? `<details><summary>Formulas &amp; reference</summary><pre></pre></details>` : ''}`;
      if(c.formulas) d.querySelector('pre').textContent = c.formulas;
      sec.appendChild(d);
    }
    main.appendChild(sec);
  }
  if(!main.children.length) main.innerHTML = '<p style="color:var(--mut);text-align:center;margin-top:40px">Kuch nahi mila — spelling check karlo.</p>';
}
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  curCls = t.dataset.cls;
  render();
}));
document.getElementById('search').addEventListener('input', render);
render();
</script>
