}
function cpSyncUI(){
  cpPlayBtn.innerHTML = (cpChapter && !caudio.paused) ? SVG_PAUSE : SVG_PLAY;
}
function cpSkip(d){
  const t = caudio.currentTime + d;
  caudio.currentTime = Math.max(0, isFinite(caudio.duration) ? Math.min(caudio.duration, t) : Math.max(0, t));
  cpSavePos();
}
function openCoursePlayer(key, tIdx, autoplay = true){
  const tracks = COURSE[key];
  if(!tracks || !tracks[tIdx] || !tracks[tIdx].audio) return;
  cpSavePos(); // store outgoing track position before switching
  cpChapter = key; cpTrackIdx = tIdx;
  const t = tracks[tIdx];
  const info = cpChapterInfo(key);
  const src = cmedia(t.base, t.audio);
  if(caudio.dataset.src !== src){
    caudio.dataset.src = src;
    caudio.src = src;
    cpPendingSeek = cpPos[cpPosKey()] || 0;
    cpCur.textContent = fmt(cpPendingSeek);
    cpDur.textContent = t.dur || '--:--';
    cpSeek.value = 0; cpSeekFill(0);
  }
  document.getElementById('cp-chapter').textContent = `Ch ${info.num} · ${info.title}`;
  document.getElementById('cp-track-label').textContent = `${t.name} track · full chapter`;
  cpRenderTracks(); cpRenderDl(); cpRenderChaps();
  cpEl.classList.add('show');
  if(!audio.paused) audio.pause();
  caudio.playbackRate = SPEEDS[cpSpeedIdx];
  cpSpeedBtn.textContent = SPEEDS[cpSpeedIdx] + 'x';
  if(autoplay) caudio.play().catch(()=>{});
  try{ localStorage.setItem(CP_LAST_KEY, JSON.stringify([key, tIdx])); }catch(e){}
  cpSyncUI(); setCourseMediaMeta(); bindMedia('course');
}
function cpRenderTracks(){
  const wrap = document.getElementById('cp-tracks'); wrap.innerHTML = '';
  COURSE[cpChapter].forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'cp-tchip' + (i === cpTrackIdx ? ' active' : '');
    b.disabled = !t.audio;
    b.innerHTML = t.name + (t.audio ? (t.dur ? `<em>${t.dur}</em>` : '') : '<em>coming soon</em>');
    if(t.audio) b.addEventListener('click', () => { if(i !== cpTrackIdx) openCoursePlayer(cpChapter, i); });
    wrap.appendChild(b);
  });
}
function cpRenderDl(){
  const wrap = document.getElementById('cp-dl'); wrap.innerHTML = '';
  const t = COURSE[cpChapter][cpTrackIdx];
  const slug = cpChapter.split('/').pop().replace(/\.[^.]+$/, '');
  const mk = (file, label, ext, fname, abs) => {
    const l = document.createElement('a'); l.className = 'dl';
    l.href = abs ? file : t.base + file;
    l.download = slug + '-' + t.name.toUpperCase() + '-' + (fname || label.toLowerCase().replace(/ /g,'-')) + ext;
    l.innerHTML = DL_SVG + '<span>' + label + '</span>';
    return l;
  };
  wrap.appendChild(mk(cmedia(t.base, t.audio), 'Audio', '.m4a', 'audio', true));
  if(t.notes) wrap.appendChild(mk(t.notes, 'Notes PDF', '.pdf', 'notes'));
  if(t.formulas) wrap.appendChild(mk(t.formulas, 'Formula sheet', '.pdf', 'formula-sheet'));
}
function cpRenderChaps(){
  const wrap = document.getElementById('cp-chaps'); wrap.innerHTML = '';
  for(const key of Object.keys(COURSE)){
    const info = cpChapterInfo(key);
    const tracks = COURSE[key];
    const firstReady = tracks.findIndex(t => t.audio);
    let resume = '';
    for(const t of tracks){ const p = cpPos[key + '|' + t.name]; if(p && p > 30){ resume = t.name + ' ' + fmt(p); break; } }
    const b = document.createElement('button');
    b.className = 'cp-chapitem' + (key === cpChapter ? ' active' : '');
    b.style.setProperty('--sc', SUBJ_COLOR[info.subject] || '#38bdf8');
    b.disabled = firstReady < 0;
    b.innerHTML = `<span class="cp-cnum">${String(info.num).padStart(2,'0')}</span><span class="cp-ct">${info.title}</span><em>${resume || (firstReady < 0 ? 'soon' : '')}</em>`;
    if(firstReady >= 0) b.addEventListener('click', () => {
      if(key === cpChapter) return;
      const same = cpTrackIdx < tracks.length && tracks[cpTrackIdx].audio ? cpTrackIdx : firstReady;
      openCoursePlayer(key, same);
    });
    wrap.appendChild(b);
  }
}
function cpGo(dir){
  const keys = Object.keys(COURSE);
  let ki = keys.indexOf(cpChapter), ti = cpTrackIdx + dir;
  while(ki >= 0 && ki < keys.length){
    const tracks = COURSE[keys[ki]];
    while(ti >= 0 && ti < tracks.length){
      if(tracks[ti].audio){ openCoursePlayer(keys[ki], ti); return true; }
      ti += dir;
    }
    ki += dir;
    ti = dir > 0 ? 0 : (ki >= 0 && ki < keys.length ? COURSE[keys[ki]].length - 1 : 0);
  }
  return false;
}
function setCourseMediaMeta(){
  if(!('mediaSession' in navigator)) return;
  const info = cpChapterInfo(cpChapter);
  try{ navigator.mediaSession.metadata = new MediaMetadata({title:`Ch ${info.num} · ${info.title}`, artist:'Divya · ' + cpTrackName(), album:'PCM Voice Notes'}); }catch(e){}
}
function bindMedia(mode){
  if(!('mediaSession' in navigator)) return;
  const ms = navigator.mediaSession;
  const h = (n, f) => { try{ ms.setActionHandler(n, f); }catch(e){} };
  if(mode === 'course'){
    h('play', () => caudio.play()); h('pause', () => caudio.pause());
    h('previoustrack', () => cpGo(-1)); h('nexttrack', () => cpGo(1));
    h('seekbackward', () => cpSkip(-15)); h('seekforward', () => cpSkip(30));
    h('seekto', d => { if(isFinite(caudio.duration)) caudio.currentTime = d.seekTime; });
  } else {
    h('play', () => audio.play()); h('pause', () => audio.pause());
    h('previoustrack', () => go(-1)); h('nexttrack', () => go(1));
    h('seekbackward', null); h('seekforward', null);
    h('seekto', d => { if(isFinite(audio.duration)) audio.currentTime = d.seekTime; });
  }
}

caudio.addEventListener('loadedmetadata', () => {
  cpDur.textContent = fmt(caudio.duration);
  if(cpPendingSeek > 0 && cpPendingSeek < caudio.duration - 3){
    caudio.currentTime = cpPendingSeek;
  }
  cpPendingSeek = 0;
});
caudio.addEventListener('timeupdate', () => {
  if(!cpSeeking && isFinite(caudio.duration) && caudio.duration > 0){
    const pct = (caudio.currentTime / caudio.duration) * 100;
    cpSeek.value = Math.round(pct * 10);
    cpSeekFill(pct);
    cpCur.textContent = fmt(caudio.currentTime);
  }
  const now = Date.now();
  if(now - cpLastSave > 5000){ cpLastSave = now; cpSavePos(); }
});
caudio.addEventListener('play', () => {
  if(!audio.paused) audio.pause();
  caudio.playbackRate = SPEEDS[cpSpeedIdx];
  cpSyncUI(); setCourseMediaMeta(); bindMedia('course');
});
caudio.addEventListener('pause', () => { cpSyncUI(); cpSavePos(); });
caudio.addEventListener('ended', () => {
  cpPos[cpPosKey()] = 0;
  try{ localStorage.setItem(CP_POS_KEY, JSON.stringify(cpPos)); }catch(e){}
  cpSyncUI();
  cpGo(1); // autoplay next available track/chapter, silently; stops at end of list
});

cpSeek.addEventListener('input', () => {
  cpSeeking = true;
  const pct = cpSeek.value / 10;
  cpSeekFill(pct);
  if(isFinite(caudio.duration)) cpCur.textContent = fmt(caudio.duration * cpSeek.value / 1000);
});
cpSeek.addEventListener('change', () => {
  if(isFinite(caudio.duration)) caudio.currentTime = caudio.duration * cpSeek.value / 1000;
  cpSeeking = false;
  cpSavePos();
});
cpPlayBtn.addEventListener('click', () => { if(cpChapter) caudio.paused ? caudio.play().catch(()=>{}) : caudio.pause(); });
document.getElementById('cp-back').addEventListener('click', () => cpSkip(-15));
document.getElementById('cp-fwd').addEventListener('click', () => cpSkip(30));
cpSpeedBtn.addEventListener('click', () => {
  cpSpeedIdx = (cpSpeedIdx + 1) % SPEEDS.length;
  caudio.playbackRate = SPEEDS[cpSpeedIdx];
  cpSpeedBtn.textContent = SPEEDS[cpSpeedIdx] + 'x';
  try{ localStorage.setItem(CP_SPEED_KEY, String(SPEEDS[cpSpeedIdx])); }catch(e){}
});
document.getElementById('cp-close').addEventListener('click', () => {
  cpSavePos();
  caudio.pause();
  cpEl.classList.remove('show');
  render(); // refresh Resume labels on chapter cards
});
document.addEventListener('keydown', e => {
  if(!cpEl.classList.contains('show')) return;
  if(e.target && e.target.tagName === 'INPUT' && e.target !== cpSeek) return;
  if(e.key === 'ArrowLeft'){ cpSkip(-15); e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ cpSkip(30); e.preventDefault(); }
  else if(e.key === ' '){ e.preventDefault(); if(cpChapter) caudio.paused ? caudio.play().catch(()=>{}) : caudio.pause(); }
  else if(e.key === 'Escape'){ document.getElementById('cp-close').click(); }
});

function buildFormulas(host, c){
  const panel = document.createElement('div'); panel.className = 'fx-panel';
  const head = document.createElement('div'); head.className = 'fx-head';
  const title = document.createElement('span'); title.textContent = 'Formulas & reference';
  const cp = document.createElement('button'); cp.className = 'fx-copy'; cp.type = 'button';
  cp.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copy</span>';
  cp.addEventListener('click', async () => {
    const text = c.formulas || '';
    try{ await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement('textarea'); ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      ta.remove();
    }
    cp.classList.add('ok'); cp.querySelector('span').textContent = 'Copied';
    setTimeout(() => { cp.classList.remove('ok'); cp.querySelector('span').textContent = 'Copy'; }, 1400);
  });
  head.append(title, cp); panel.appendChild(head);
  const list = document.createElement('div'); list.className = 'fx-list';
  const renderMath = (span, latex, fallback) => {
    try{
      if(window.katex){ katex.render(latex, span, {throwOnError:true}); return; }
      throw new Error('no katex');
    }catch(e){ span.textContent = fallback; span.classList.add('fx-plain'); }
  };
  for(const item of (ROWS[c.file] || [])){
    if(item.sec !== undefined){
      const s = document.createElement('div'); s.className = 'fx-sec';
      s.textContent = item.sec;
      list.appendChild(s); continue;
    }
    const row = document.createElement('div'); row.className = 'fx-row';
    if(item.label){
      const l = document.createElement('span'); l.className = 'fx-label'; l.textContent = item.label + ':';
      row.appendChild(l);
    }
    for(const seg of item.seg){
      const b = document.createElement('span');
      if(seg.t === 'm'){ b.className = 'fx-txt fx-math'; renderMath(b, seg.s, seg.raw || ''); }
      else { b.className = 'fx-txt'; b.textContent = seg.s; }
      row.appendChild(b);
    }
    list.appendChild(row);
  }
  panel.appendChild(list); host.appendChild(panel);
}

function buildCourse(host, c){
  const tracks = COURSE[c.file];
  const slug = c.file.split('/').pop().replace(/\.[^.]+$/, '');
  const panel = document.createElement('div'); panel.className = 'fx-panel';
  const head = document.createElement('div'); head.className = 'fx-head';
  const title = document.createElement('span'); title.textContent = 'Full course · deep chapter audio';
  head.appendChild(title); panel.appendChild(head);
  tracks.forEach((t, i) => {
    const b = document.createElement('div'); b.className = 'track-block';
    const nm = document.createElement('div'); nm.className = 'track-name';
    const s = document.createElement('span'); s.textContent = t.name;
    nm.appendChild(s);
    if(t.audio && t.dur){ const d = document.createElement('em'); d.className = 'track-dur'; d.textContent = t.dur; nm.appendChild(d); }
    b.appendChild(nm);
    if(t.audio){
      const pos = cpPos[c.file + '|' + t.name] || 0;
      const pb = document.createElement('button'); pb.className = 'cp-openbtn'; pb.type = 'button';
      pb.innerHTML = SVG_PLAY + '<span>' + (pos > 30 ? 'Resume · ' + fmt(pos) : 'Play') + '</span>';
      pb.addEventListener('click', () => openCoursePlayer(c.file, i));
      b.appendChild(pb);
      const row = document.createElement('div'); row.className = 'dl-row';
      const mk = (href, label, ext, fname) => {
        const l = document.createElement('a'); l.className = 'dl';
        l.href = href; l.download = slug + '-' + t.name.toUpperCase() + '-' + (fname || label.toLowerCase().replace(/ /g,'-')) + ext;
        l.innerHTML = DL_SVG + '<span>' + label + '</span>';
        return l;
      };
      row.appendChild(mk(cmedia(t.base, t.audio), 'Audio', '.m4a', 'audio'));
      if(t.notes) row.appendChild(mk(t.base + t.notes, 'Notes PDF', '.pdf', 'notes'));
      if(t.formulas) row.appendChild(mk(t.base + t.formulas, 'Formula sheet', '.pdf', 'formula-sheet'));
      b.appendChild(row);
    } else {
      const soon = document.createElement('div'); soon.className = 'track-soon';
      soon.textContent = 'coming soon';
      b.appendChild(soon);
    }
    panel.appendChild(b);
  });
  host.appendChild(panel);
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', !!q);
  main.innerHTML = '';
  for(const s of SUBJECTS){
    if(curSubj !== 'all' && s !== curSubj) continue;
    const items = DATA.filter(c => c.cls === curCls && c.subject === s &&
      (!q || (c.title+' '+c.tags).toLowerCase().includes(q)));
    if(!items.length) continue;
    const sec = document.createElement('section');
    sec.innerHTML = `<div class="subj-head"><span class="subj-dot" style="background:${SUBJ_COLOR[s]}"></span><h2>${s}</h2><span class="count">${items.length} chapters</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    for(const c of items){
      const id = c.file; CH[id] = c;
      const d = document.createElement('div');
      d.className = 'chap' + (id === currentId ? ' playing' : '');
      d.style.setProperty('--sc', SUBJ_COLOR[s]);
      d.dataset.id = id;
      d.innerHTML = `
        <div class="chap-top">
          <span class="num">${String(c.num).padStart(2,'0')}</span>
          <div class="chap-meta"><h3>${c.title}</h3><div class="tags">${c.tags}</div></div>
        </div>
        <div class="player">
          <button class="pbtn card-play" aria-label="Play ${c.title}">${id===currentId && !audio.paused ? SVG_PAUSE : SVG_PLAY}</button>
          <div class="track">
            <div class="bar card-bar"><div class="fill"></div></div>
            <div class="times"><span class="cur">0:00</span><span class="dur">--:--</span></div>
          </div>
        </div>
        <button class="fxbtn">Formulas &amp; reference <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="fx"></div>`;
      buildFormulas(d.querySelector('.fx'), c);
      if(COURSE[id]){
        const ready = COURSE[id].filter(t => t.audio);
        const cbtn = document.createElement('button');
        cbtn.className = 'fxbtn coursebtn'; cbtn.type = 'button';
        cbtn.innerHTML = 'Full course' + (ready.length ? ' · ' + ready.map(t => t.name + (t.dur ? ' ' + t.dur : '')).join(' · ') : '') + ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
        const cdiv = document.createElement('div'); cdiv.className = 'course';
        buildCourse(cdiv, c);
        cbtn.addEventListener('click', () => d.classList.toggle('courseopen'));
        d.appendChild(cbtn); d.appendChild(cdiv);
      }
      d.querySelector('.card-play').addEventListener('click', () => togglePlay(c, id));
      d.querySelector('.card-bar').addEventListener('click', e => seek(e, id));
      d.querySelector('.fxbtn').addEventListener('click', () => d.classList.toggle('fxopen'));
      grid.appendChild(d);
    }
    sec.appendChild(grid);
    main.appendChild(sec);
  }
  if(!main.children.length) main.innerHTML = '<p class="empty">Kuch nahi mila — spelling check karlo.</p>';
}

function togglePlay(c, id){
  if(currentId === id){
    audio.paused ? audio.play() : audio.pause();
    return;
  }
  currentId = id;
  localStorage.setItem('pcm-last', id);
  audio.src = id;
  audio.play().catch(()=>{});
  miniTitle.textContent = `Ch ${c.num} · ${c.title}`;
  mini.classList.add('show');
  syncUI();
  setMediaMeta(c);
}

// invisible behaviour: queue = chapters currently visible (class tab, subject chip, search), in page order
function step(dir){
  const q = [...document.querySelectorAll('.chap')].map(e => e.dataset.id);
  const i = q.indexOf(currentId), j = i < 0 ? -1 : i + dir;
  return (j >= 0 && j < q.length) ? q[j] : null;
}
function go(dir){
  const id = step(dir);
  if(id && CH[id]){ togglePlay(CH[id], id); return true; }
  return false;
}
function setMediaMeta(c){
  if(!('mediaSession' in navigator)) return;
  try{ navigator.mediaSession.metadata = new MediaMetadata({title:`Ch ${c.num} · ${c.title}`, artist:'PCM Voice Notes', album:'PCM Voice Notes'}); }catch(e){}
}
bindMedia('mini');

function seek(e, id){
  if(id !== currentId || !isFinite(audio.duration)) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
}

function syncUI(){
  const isPlaying = currentId && !audio.paused;
  document.querySelectorAll('.chap').forEach(el => {
    const active = el.dataset.id === currentId;
    el.classList.toggle('playing', active);
    const btn = el.querySelector('.card-play');
    if(btn) btn.innerHTML = (active && isPlaying) ? SVG_PAUSE : SVG_PLAY;
    if(!active){
      el.querySelector('.fill').style.width = '0%';
      el.querySelector('.cur').textContent = '0:00';
    }
  });
  miniPlay.innerHTML = isPlaying ? SVG_PAUSE : SVG_PLAY;
}

audio.addEventListener('timeupdate', () => {
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  miniFill.style.width = pct + '%';
  miniTime.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
  const el = document.querySelector(`.chap[data-id="${CSS.escape(currentId)}"]`);
  if(el){
    el.querySelector('.fill').style.width = pct + '%';
    el.querySelector('.cur').textContent = fmt(audio.currentTime);
    el.querySelector('.dur').textContent = fmt(audio.duration);
  }
});
audio.addEventListener('loadedmetadata', () => {
  const el = document.querySelector(`.chap[data-id="${CSS.escape(currentId)}"]`);
  if(el) el.querySelector('.dur').textContent = fmt(audio.duration);
});
audio.addEventListener('play', syncUI);
audio.addEventListener('play', () => { if(!caudio.paused) caudio.pause(); bindMedia('mini'); });
audio.addEventListener('pause', syncUI);
audio.addEventListener('ended', () => { syncUI(); go(1); });  // always-on autoplay next; stops at end of list

miniPlay.addEventListener('click', () => { if(currentId) audio.paused ? audio.play() : audio.pause(); });
miniBar.addEventListener('click', e => seek(e, currentId));
document.getElementById('mini-close').addEventListener('click', () => {
  audio.pause(); audio.removeAttribute('src'); audio.load();
  currentId = null; mini.classList.remove('show'); syncUI();
  miniFill.style.width = '0%'; miniTime.textContent = '0:00 / 0:00';
});

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  curCls = t.dataset.cls;
  localStorage.setItem('pcm-cls', curCls);
  render();
}));
searchEl.addEventListener('input', render);
clearBtn.addEventListener('click', () => { searchEl.value = ''; render(); searchEl.focus(); });

document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  ch.classList.add('active');
  curSubj = ch.dataset.subj;
  localStorage.setItem('pcm-subj', curSubj);
  render();
}));
// restore saved subject chip + tab
document.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x.dataset.subj === curSubj));

// restore saved tab
if(curCls !== '12'){
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.cls === curCls));
}
miniPlay.innerHTML = SVG_PLAY;
render();
</script>
</body>
</html>
